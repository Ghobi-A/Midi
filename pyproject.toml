[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-audio-lab"
version = "0.1.0"
description = "A prompt-conditioned symbolic music generator that creates DAW-ready MIDI arrangements instead of finished audio."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "mido",
    "numpy",
]

[project.optional-dependencies]
app = [
    "streamlit",
]
dev = [
    "pytest",
    # Pinned to a minor range: Ruff's *default* rule set grows between
    # releases (0.16 added pyupgrade, isort and more), so an unpinned linter
    # turns an unrelated upstream release into a red build. The rules CI
    # enforces are declared explicitly under [tool.ruff.lint] below.
    "ruff>=0.15,<0.17",
]
audio = [
    "librosa",
    "soundfile",
    "pyloudnorm",
    "demucs",
    "spleeter",
    "torchaudio",
]
ml = [
    "torch",
    "transformers",
    "scikit-learn",
    "datasets",
]
# Optional symbolic-tokenization stack (Stage 1.5). The internal tokenizer in
# creative_audio_lab.tokenization needs none of these — they only power the
# MidiTok REMI adapter for tokenizing external MIDI files.
symbolic = [
    "miditok",
    "symusic",
]

[project.scripts]
ai-master = "mastering.ai_master:main"

# Explicit package discovery: creative_audio_lab lives under src/, while the
# legacy audio-production utilities remain flat at the repo root. Auto-discovery
# would otherwise error out with "multiple top-level packages discovered".
[tool.setuptools]
packages = [
    "creative_audio_lab",
    "creative_audio_lab.generators",
    "creative_audio_lab.export",
    "creative_audio_lab.evaluation",
    "creative_audio_lab.data",
    "creative_audio_lab.tokenization",
    "creative_audio_lab.models",
    "creative_audio_lab.preview",
    "midi",
    "separation",
    "mix_prep",
    "human_mix",
    "mastering",
    "upscaling",
]

[tool.setuptools.package-dir]
creative_audio_lab = "src/creative_audio_lab"

[tool.ruff.lint]
# Ruff's historical default rule set, stated explicitly so what CI enforces
# is a property of this repository rather than of whichever Ruff version the
# runner happened to install. Broader families (pyupgrade, isort, RUF) are a
# deliberate repo-wide modernization, not something to inherit silently.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# app.py and the scripts insert src/ onto sys.path before importing so they
# also run without an editable install; that necessarily puts imports after
# top-of-file code.
"app.py" = ["E402"]
"scripts/*.py" = ["E402"]
