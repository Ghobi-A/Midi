name: tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only ever read the checked-out source. Without
# an explicit block the GITHUB_TOKEN inherits the repository default, which
# can include write scopes these jobs have no use for.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package declares requires-python >= 3.9, so CI has to prove it
        # on the oldest and newest supported interpreters, not just one.
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Lightweight install path: core deps (mido, numpy) + dev extras only.
      # No ML/audio extras (torch, librosa, demucs, spleeter, ...) required.
      # This job also runs the end-to-end corpus pipeline smoke test, which
      # builds its own synthetic MIDI fixture corpus — nothing is downloaded.
      - name: Install project (core + dev extras)
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ app.py tests/ scripts/

      - name: Run pytest
        run: pytest -q

  symbolic-extras:
    # The optional MidiTok/symusic tokenization path is skipped entirely in
    # the core job; without this job its adapter tests never actually run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project (dev + symbolic extras)
        run: pip install -e ".[dev,symbolic]"

      - name: Run symbolic tokenization and pipeline tests
        run: pytest -q tests/test_miditok_adapter.py tests/test_tokenization.py tests/test_pipeline_smoke.py
