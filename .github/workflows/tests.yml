name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Lightweight install path: core deps (mido, numpy) + dev extras only.
      # No ML/audio extras (torch, librosa, demucs, spleeter, ...) required.
      - name: Install project (core + dev extras)
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q
